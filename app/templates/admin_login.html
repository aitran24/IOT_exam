<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Quản Trị - Photobooth</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --primary: #4f46e5;
            --accent: #06b6d4;
        }
        body {
            background-color: var(--bg);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .login-card {
            background: var(--card);
            border-radius: 1.25rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 440px;
        }
        .form-control {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            border-radius: 0.6rem;
            padding: 0.75rem 1rem;
        }
        .form-control:focus {
            background: #ffffff;
            border-color: var(--primary);
            color: #1e293b;
            box-shadow: 0 0 0 0.25rem rgba(79, 70, 229, 0.15);
        }
        .input-group-text {
            background: #f8fafc;
            border-color: #cbd5e1;
            color: #64748b;
        }
        .btn-login {
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 0.6rem;
            padding: 0.8rem;
            width: 100%;
            transition: all 0.2s ease;
        }
        .btn-login:hover {
            opacity: 0.95;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }
    </style>
</head>
<body class="p-3">
    <div class="login-card p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-3">
                <i class="bi bi-shield-lock-fill fs-2"></i>
            </div>
            <h4 class="fw-bold text-dark">Cổng Quản Trị Photobooth</h4>
            <p class="text-muted small">Xác thực 2 yếu tố (Mật khẩu + mã TOTP 2FA)</p>
        </div>

        <div id="error-alert" class="alert alert-danger py-2 small" style="display: none;"></div>

        <form id="admin-login-form" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label small text-muted fw-medium">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" class="form-control" placeholder="admin" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small text-muted fw-medium">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu quản trị" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small text-muted fw-medium">Mã TOTP 2FA (6 chữ số từ Google Authenticator)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-clock"></i></span>
                    <input type="text" id="totp_code" class="form-control text-center font-monospace fs-5" placeholder="123456" maxlength="6" required>
                </div>
            </div>

            <button type="submit" class="btn btn-login" id="submit-btn">
                <i class="bi bi-box-arrow-in-right me-2"></i>Đăng Nhập An Toàn
            </button>
        </form>

        <div class="mt-4 pt-3 text-center border-top border-secondary border-opacity-10 text-muted small">
            <i class="bi bi-shield-check text-success me-1"></i>Phiên làm việc tự hết hạn sau 30 phút không hoạt động
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const errBox = document.getElementById("error-alert");
            const btn = document.getElementById("submit-btn");
            errBox.style.display = "none";
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Đang xác thực...`;

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const totp_code = document.getElementById("totp_code").value.trim();

            try {
                const res = await fetch("/api/v1/admin/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password, totp_code })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    sessionStorage.setItem("admin_token", data.token);
                    sessionStorage.setItem("admin_role", data.admin.role);
                    sessionStorage.setItem("admin_username", data.admin.username);
                    window.location.href = "/admin";
                } else {
                    errBox.innerText = data.error ? data.error.message : "Đăng nhập thất bại";
                    errBox.style.display = "block";
                }
            } catch (err) {
                errBox.innerText = "Lỗi kết nối tới máy chủ: " + err;
                errBox.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-box-arrow-in-right me-2"></i>Đăng Nhập An Toàn`;
            }
        }
    </script>
</body>
</html>
