<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên Kết Đã Hết Hạn - Photobooth</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .box {
            background: #ffffff;
            border-radius: 1.5rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            max-width: 480px;
        }
    </style>
</head>
<body class="p-3">
    <div class="box p-5 text-center">
        <i class="bi bi-clock-history text-danger display-1 mb-3"></i>
        <h3 class="fw-bold text-dark mb-3">Ảnh Đã Hết Hạn Lưu Trữ</h3>
        <p class="text-muted small mb-4">
            Theo chính sách bảo vệ dữ liệu cá nhân (Luật số 91/2025/QH15), ảnh và video chụp chế độ khách web chỉ được lưu giữ trong vòng <strong>24 giờ</strong> và đã được hệ thống tự động xóa an toàn vĩnh viễn khỏi máy chủ.
        </p>
        <a href="/guest" class="btn btn-outline-dark px-4 py-2 rounded-pill">
            <i class="bi bi-arrow-left me-1"></i>Quay Về Trang Ví Khách
        </a>
    </div>
</body>
</html>
